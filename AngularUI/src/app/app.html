<div class="app-layout">
  <!-- Top Navigation Bar -->
  <app-navbar
    [currentView]="currentView"
    (logoutEvent)="onLogout()"
    (navigateDashboard)="checkInitialSession()"
  />

  <!-- Main View Router -->
  <main class="app-main">
    <!-- 1. GUEST / LANDING VIEW: Login & Registration -->
    @if (currentView === 'landing') {
      <app-landing-page
        [states]="states"
        [cities]="cities"
        (authSuccess)="onAuthSuccess($event)"
      />
    }

    <!-- 2. USER / BUYER DASHBOARD -->
    @else if (currentView === 'user') {
      <app-user-dashboard />
    }

    <!-- 3. SELLER DASHBOARD -->
    @else if (currentView === 'seller') {
      <app-seller-portal />
    }

    <!-- 4. ADMIN DASHBOARD -->
    @else if (currentView === 'admin') {
      <app-admin-panel />
    }
  </main>

  <!-- Global Common Error Notification (Req 15) -->
  <app-common-error />
</div>
