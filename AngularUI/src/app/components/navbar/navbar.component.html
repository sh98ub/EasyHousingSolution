<nav class="app-navbar">
  <div class="navbar-container">
    <!-- Brand Logo -->
    <div class="navbar-brand" (click)="onLogoClick()" style="cursor: pointer;">
      <div class="brand-logo-icon">🏠</div>
      <div class="brand-text">
        <span class="brand-title">Easy Housing Solutions</span>
        <span class="brand-tagline">Real Estate Marketplace</span>
      </div>
    </div>

    <!-- Right Side Actions & User Info -->
    <div class="navbar-actions">
      @if (isLoggedIn && user) {
        <div class="user-badge-group">
          <span class="user-greeting">👤 {{ user.fullName }}</span>
          <span class="role-pill" [class.role-admin]="user.userType === 'Admin'" [class.role-seller]="user.userType === 'Seller'" [class.role-buyer]="user.userType === 'Buyer'">
            {{ user.userType }}
          </span>
        </div>

        <button type="button" class="btn-nav-dashboard" (click)="navigateDashboard.emit()">
          Dashboard
        </button>

        <button type="button" class="btn-nav-logout" (click)="onLogout()">
          Logout 🚪
        </button>
      } @else {
        <span class="guest-label">Please login to access your dashboard</span>
      }
    </div>
  </div>
</nav>
