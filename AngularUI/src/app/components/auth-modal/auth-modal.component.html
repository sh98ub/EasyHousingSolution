@if (isOpen()) {
  <div class="modal-backdrop" (click)="onBackdropClick($event)">
    <div class="modal-card">
      <!-- Modal Header -->
      <div class="modal-header">
        <div>
          <h2 class="modal-title">Welcome to EasyHousing</h2>
          <p class="modal-sub">Login or create your account to continue</p>
        </div>
        <button class="btn-close" (click)="closeModal()" title="Close dialog">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Tabs: Login / Register Buyer / Register Seller -->
      <div class="modal-tabs">
        <button
          class="tab-link"
          [class.active]="activeTab === 'login'"
          (click)="activeTab = 'login'"
        >
          Login
        </button>
        <button
          class="tab-link"
          [class.active]="activeTab === 'buyer'"
          (click)="activeTab = 'buyer'"
        >
          Register Buyer
        </button>
        <button
          class="tab-link"
          [class.active]="activeTab === 'seller'"
          (click)="activeTab = 'seller'"
        >
          Register Seller
        </button>
      </div>

      <!-- Notification Banner -->
      @if (errorMessage()) {
        <div class="alert alert-error">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
          </svg>
          <span>{{ errorMessage() }}</span>
        </div>
      }
      @if (successMessage()) {
        <div class="alert alert-success">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
          </svg>
          <span>{{ successMessage() }}</span>
        </div>
      }

      <!-- TAB 1: LOGIN -->
      @if (activeTab === 'login') {
        <form (ngSubmit)="handleLogin()" class="form-body">
          <div class="form-group">
            <label>Email ID / Username</label>
            <input
              type="email"
              class="form-control"
              placeholder="name@example.com"
              [(ngModel)]="loginEmail"
              name="email"
              required
            />
          </div>

          <div class="form-group">
            <label>Password</label>
            <input
              type="password"
              class="form-control"
              placeholder="Enter your password"
              [(ngModel)]="loginPassword"
              name="password"
              required
            />
          </div>

          <button type="submit" class="btn-submit-mmt" [disabled]="loading()">
            {{ loading() ? 'Signing In...' : 'LOGIN' }}
          </button>

          <!-- Quick Demo Fill Buttons -->
          <div class="demo-helpers">
            <span class="demo-label">Quick Sign-in:</span>
            <div class="demo-chips">
              <button type="button" class="btn-demo" (click)="fillDemo('admin')">
                Admin
              </button>
              <button type="button" class="btn-demo" (click)="fillDemo('buyer')">
                Buyer
              </button>
              <button type="button" class="btn-demo" (click)="fillDemo('seller')">
                Seller
              </button>
            </div>
          </div>
        </form>
      }

      <!-- TAB 2: REGISTER BUYER -->
      @if (activeTab === 'buyer') {
        <form (ngSubmit)="handleRegisterBuyer()" class="form-body">
          <div class="form-group">
            <label>Full Name</label>
            <input
              type="text"
              class="form-control"
              placeholder="e.g. John Doe"
              [(ngModel)]="buyerName"
              name="buyerName"
              required
            />
          </div>

          <div class="form-group">
            <label>Email ID (will be your username)</label>
            <input
              type="email"
              class="form-control"
              placeholder="buyer@example.com"
              [(ngModel)]="buyerEmail"
              name="buyerEmail"
              required
            />
          </div>

          <div class="form-group">
            <label>Phone Number (10 digits)</label>
            <input
              type="tel"
              class="form-control"
              placeholder="9876543210"
              [(ngModel)]="buyerPhone"
              name="buyerPhone"
              required
            />
          </div>

          <div class="form-group">
            <label>Date of Birth (Must be 18+)</label>
            <input
              type="date"
              class="form-control"
              [max]="maxDobDate"
              [(ngModel)]="buyerDob"
              name="buyerDob"
              required
            />
          </div>

          <div class="form-group">
            <label>Password</label>
            <input
              type="password"
              class="form-control"
              placeholder="Min 6 characters"
              [(ngModel)]="buyerPassword"
              name="buyerPassword"
              required
            />
          </div>

          <button type="submit" class="btn-submit-mmt" [disabled]="loading()">
            {{ loading() ? 'Registering...' : 'CREATE BUYER ACCOUNT' }}
          </button>
        </form>
      }

      <!-- TAB 3: REGISTER SELLER -->
      @if (activeTab === 'seller') {
        <form (ngSubmit)="handleRegisterSeller()" class="form-body">
          <div class="form-row">
            <div class="form-group">
              <label>Full Name</label>
              <input
                type="text"
                class="form-control"
                placeholder="e.g. Rajesh Sharma"
                [(ngModel)]="sellerName"
                name="sellerName"
                required
              />
            </div>
            <div class="form-group">
              <label>Phone Number</label>
              <input
                type="tel"
                class="form-control"
                placeholder="9876543210"
                [(ngModel)]="sellerPhone"
                name="sellerPhone"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label>Email ID (Username)</label>
            <input
              type="email"
              class="form-control"
              placeholder="seller@example.com"
              [(ngModel)]="sellerEmail"
              name="sellerEmail"
              required
            />
          </div>

          <div class="form-group">
            <label>Password</label>
            <input
              type="password"
              class="form-control"
              placeholder="Min 6 characters"
              [(ngModel)]="sellerPassword"
              name="sellerPassword"
              required
            />
          </div>

          <div class="form-group">
            <label>Date of Birth (Must be 18+)</label>
            <input
              type="date"
              class="form-control"
              [max]="maxDobDate"
              [(ngModel)]="sellerDob"
              name="sellerDob"
              required
            />
          </div>

          <div class="form-group">
            <label>Registered Address</label>
            <input
              type="text"
              class="form-control"
              placeholder="Flat/House no, Street area"
              [(ngModel)]="sellerAddress"
              name="sellerAddress"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>State</label>
              <select
                class="form-control"
                [(ngModel)]="sellerStateId"
                name="sellerState"
                (change)="onSellerStateChange()"
              >
                <option [ngValue]="null">Select State</option>
                @for (s of states(); track s.stateId) {
                  <option [ngValue]="s.stateId">{{ s.stateName }}</option>
                }
              </select>
            </div>

            <div class="form-group">
              <label>City</label>
              <select
                class="form-control"
                [(ngModel)]="sellerCityId"
                name="sellerCity"
              >
                <option [ngValue]="null">Select City</option>
                @for (c of filteredSellerCities; track c.cityId) {
                  <option [ngValue]="c.cityId">{{ c.cityName }}</option>
                }
              </select>
            </div>
          </div>

          <button type="submit" class="btn-submit-mmt" [disabled]="loading()">
            {{ loading() ? 'Registering...' : 'CREATE SELLER ACCOUNT' }}
          </button>
        </form>
      }
    </div>
  </div>
}
